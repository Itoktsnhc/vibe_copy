name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish
        shell: pwsh
        run: |
          dotnet publish -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true -p:PublishTrimmed=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: VibeCopy
          path: publish/VibeCopy.exe

      - name: Compose release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $sha = (Get-FileHash publish/VibeCopy.exe -Algorithm SHA256).Hash.ToLower()
          $body = "## VibeCopy ${{ github.ref_name }}`n`n- **SHA256**: ``$sha```n"
          [IO.File]::WriteAllText("$PWD/release-notes.md", $body)

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/VibeCopy.exe
          body_path: release-notes.md
